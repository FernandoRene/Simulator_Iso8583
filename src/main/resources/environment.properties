# Información del Sistema
Sistema.Nombre=Framework de Testing Automatizado ISO8583
Sistema.Version=1.0.0
Sistema.Autor=Fernando (Tesista)
Sistema.Universidad=Universidad Unión Bolivariana
Sistema.Ubicacion=La Paz, Bolivia

# Ambiente de Ejecución
Ambiente=TEST
Modo.Conexion=MOCK/REAL (Configurable)
Autorizador.Host=172.16.1.211
Autorizador.Port=5105

# Tecnologías
Java.Version=21
Spring.Boot.Version=3.x
Cucumber.Version=7.15.0
RestAssured.Version=5.4.0
Allure.Version=2.25.0
jPOS.Version=2.1.x

# Framework de Testing
Test.Framework=Cucumber BDD
Test.Runner=JUnit 5
Test.Reports=Allure, Cucumber HTML, Maven Surefire
Test.Architecture=Strategy Pattern + Page Object Model

# Tipos de Transacciones Soportadas
Transacciones.Balance.Inquiry=301099
Transacciones.Cash.Advance=170099
Transacciones.Purchase=000000
Transacciones.Transfer=400099

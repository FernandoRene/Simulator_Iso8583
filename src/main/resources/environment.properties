# Configuración de Tests
Test.Timeout=30000ms
Test.Retry.Count=0
Test.Parallel.Execution=false
Test.Screenshot.On.Failure=true

# URLs
API.Base.URL=http://localhost:8081
API.Version=v1
Swagger.URL=http://localhost:8081/swagger-ui.html

# Protocolo ISO8583
ISO8583.Version=1987
ISO8583.Packager=iso87ascii
ISO8583.Channel=ASCIIChannel
ISO8583.Message.Format=ASCII

# Reportes
Report.Directory=target/allure-results
Report.History=enabled
Report.Categories=enabled
Report.Screenshots=enabled
Report.Logs=enabled

